# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    # A push that changes ONLY these files starts no run. Keep this list
    # identical in the four push workflows; test_workflowPathsIgnore.R checks it.
    paths-ignore:
      - BACKLOG.md
      - CHANGELOG.md
      - CLAUDE.md
      - HANDOFFS.md
      - SESSION_NOTES.md
      - PROJECT_LEARNINGS.md
      - SESSION_RUNNER.md
      - SAFEGUARDS.md
      - BOOTSTRAP.md
      - FRAMEWORK_LEARNINGS.md
      - RECOMMENDED_SKILLS.md
      - ROADMAP.md
      - CLAUDE_TEMPLATE.md
      - CONTEXT_TEMPLATE.md
      - methodology_dashboard.py
      - methodology_trim.py
      - context_budget.py
      - quality_ratchet.py
      - .context-budget.json
      - .quality-gates.json
      - docs/**
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # Quarto CLI is required to build the .qmd pkgdown articles
      # (vignettes/articles/*.qmd) via pkgdown's mixed-mode support.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: |
          pkgdown::build_site_github_pages(new_process = FALSE, clean = TRUE, install = FALSE, dest_dir = "pkgdown_site")
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: pkgdown_site
