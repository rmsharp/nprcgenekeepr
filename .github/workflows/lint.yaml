# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    # A push that changes ONLY these files starts no run. Keep this list
    # identical in the four push workflows; test_workflowPathsIgnore.R checks it.
    paths-ignore:
      - BACKLOG.md
      - CHANGELOG.md
      - CLAUDE.md
      - HANDOFFS.md
      - SESSION_NOTES.md
      - PROJECT_LEARNINGS.md
      - SESSION_RUNNER.md
      - SAFEGUARDS.md
      - BOOTSTRAP.md
      - FRAMEWORK_LEARNINGS.md
      - RECOMMENDED_SKILLS.md
      - ROADMAP.md
      - CLAUDE_TEMPLATE.md
      - CONTEXT_TEMPLATE.md
      - methodology_dashboard.py
      - methodology_trim.py
      - context_budget.py
      - quality_ratchet.py
      - .context-budget.json
      - .quality-gates.json
      - docs/**
  pull_request:

name: lint.yaml

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::cyclocomp, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
